[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacebio-evidence-engine"
version = "0.1.0"
description = "A retrieval-augmented evidence and knowledge system for open-access space biology research."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "John Hernandez" },
]
keywords = [
  "space-biology",
  "rag",
  "evidence",
  "citations",
  "fastapi",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spacebio_evidence_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
