[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacebio-evidence-engine"
version = "0.1.0"
description = "A retrieval-augmented evidence and knowledge system for open-access space biology research."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "John Hernandez" },
]
keywords = [
  "space-biology",
  "rag",
  "evidence",
  "citations",
  "fastapi",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.9",
  "pyright>=1.1",
  "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spacebio_evidence_engine"]

[tool.hatch.build.targets.wheel.force-include]
"apps/api/src/spacebio_api" = "spacebio_api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "apps/api/src", "tests"]
exclude = [
  ".venv",
  "scripts",
  "node_modules",
  ".git",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps/api/src"]

[tool.pyright]
include = ["src", "apps/api/src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
