name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install "ruff>=0.9"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  python-typecheck:
    name: Python type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and pyright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ingestion]"
      - name: Pyright
        run: pyright

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ingestion]"
      - name: Pytest
        run: pytest -q

  node-lint:
    name: Node lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install web workspace
        run: npm install
      - name: Lint web app
        run: npm run lint -w @spacebio/web
