name: Research
description: Investigate a scientific, corpus, RAG, or evaluation question before implementation
title: "[research] "
labels: ["research"]
body:
  - type: markdown
    attributes:
      value: |
        Research issues produce findings, recommendations, and follow-up issues. They do not ship product behavior unless scope explicitly says so.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What question or uncertainty must be resolved?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Decision, recommendation, or evidence summary expected at the end.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Known corpus items, prior evals, related ADRs, and hypotheses.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What will be reviewed, measured, compared, or prototyped.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Implementation work that must wait for follow-up issues.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Question answered with cited sources or eval evidence
        - [ ] Recommendation and risks written
        - [ ] Follow-up issues filed if needed
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: None
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Files or components likely affected
      description: Docs, notebooks, eval fixtures, or temporary experiment branches.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing requirements
      description: Evaluation sets, manual review protocol, or reproducibility steps.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation requirements
      description: Where findings will be recorded (issue comment, ADR draft, eval notes).
    validations:
      required: true
  - type: textarea
    id: scientific_provenance
    attributes:
      label: Scientific provenance considerations
      description: Organism/system labeling, abstract vs full text, citation fidelity, conflicting evidence.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      placeholder: None / N/A — explain why if none.
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
    validations:
      required: true
  - type: dropdown
    id: parallel_safe
    attributes:
      label: Whether parallel work is safe
      options:
        - "Yes — parallel work is safe outside listed files"
        - "No — serialize related work"
        - "Unknown — needs human coordination"
    validations:
      required: true
  - type: textarea
    id: blocking_issues
    attributes:
      label: Blocking issues
      placeholder: None
    validations:
      required: true
  - type: textarea
    id: human_decisions
    attributes:
      label: Human decisions required
      description: Scientific or product calls that only the human owner should make.
    validations:
      required: true
