name: Bug
description: Report a defect in behavior, grounding, citations, data, or tooling
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include enough detail to reproduce. Do not paste secrets. See `AGENTS.md` and `SECURITY.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken? Include expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What correct behavior should look like after the fix.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: When it started, environment, repro steps, logs (redacted), and related issues.
      placeholder: |
        Steps to reproduce:
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this bugfix issue is allowed to change.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Related cleanups or refactors that must not land in this fix.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Defect no longer reproduces
        - [ ] Regression test added or updated
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: None
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Files or components likely affected
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing requirements
      description: Include the failing case that must pass after the fix.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation requirements
    validations:
      required: true
  - type: textarea
    id: scientific_provenance
    attributes:
      label: Scientific provenance considerations
      description: Citation loss, wrong grounding, organism mix-ups, or evidence mislabeling risks.
      placeholder: None / N/A — explain why if none.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      placeholder: None / N/A — explain why if none.
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
    validations:
      required: true
  - type: dropdown
    id: parallel_safe
    attributes:
      label: Whether parallel work is safe
      options:
        - "Yes — parallel work is safe outside listed files"
        - "No — serialize related work"
        - "Unknown — needs human coordination"
    validations:
      required: true
  - type: textarea
    id: blocking_issues
    attributes:
      label: Blocking issues
      placeholder: None
    validations:
      required: true
  - type: textarea
    id: human_decisions
    attributes:
      label: Human decisions required
      placeholder: None
    validations:
      required: true
