name: Feature request
description: Propose a product or engineering improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need and why it matters for the evidence engine.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist for Definition of Ready / Done.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: mvp
    attributes:
      label: MVP scope?
      options:
        - Yes — required for MVP
        - Maybe — useful but deferrable
        - No — future phase
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and constraints
      description: Citation grounding, corpus license, cost, security, or architecture constraints.
