name: Feature
description: Propose a product or engineering capability change
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Work from one issue, one branch, and one owner at a time. See `AGENTS.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or system problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What successful outcome looks like.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Context, related decisions, corpus/RAG constraints, and links.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue will change.
      placeholder: |
        -
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicit non-goals for this issue.
      placeholder: |
        -
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Checklist that must pass before the PR is ready for human review.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues, packages, services, corpus data, or humans this work depends on.
      placeholder: None
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Files or components likely affected
      description: Paths, packages, or subsystems expected to change.
      placeholder: |
        - docs/
        - src/
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing requirements
      description: Unit, integration, RAG eval, UI, migration, or manual checks required.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation requirements
      description: Docs, ADRs, prompts, or runbooks that must be updated.
    validations:
      required: true
  - type: textarea
    id: scientific_provenance
    attributes:
      label: Scientific provenance considerations
      description: Citation, grounding, corpus license, organism/system labeling, or evidence risks.
      placeholder: None / N/A — explain why if none.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Secrets, untrusted document content, auth, privacy, or exposure risks.
      placeholder: None / N/A — explain why if none.
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
      description: Issue-specific completion bar (also see docs/development/DEFINITION_OF_DONE.md).
      placeholder: |
        - [ ] Acceptance criteria pass
        - [ ] Tests / lint / typecheck pass
        - [ ] Docs current
        - [ ] PR linked and human review requested
    validations:
      required: true
  - type: dropdown
    id: parallel_safe
    attributes:
      label: Whether parallel work is safe
      description: Can another agent work elsewhere without conflicting on these files?
      options:
        - "Yes — parallel work is safe outside listed files"
        - "No — serialize related work"
        - "Unknown — needs human coordination"
    validations:
      required: true
  - type: textarea
    id: blocking_issues
    attributes:
      label: Blocking issues
      description: Issue numbers or links that block this work.
      placeholder: None
    validations:
      required: true
  - type: textarea
    id: human_decisions
    attributes:
      label: Human decisions required
      description: Decisions that must be made by the human owner before or during implementation.
      placeholder: None
    validations:
      required: true
