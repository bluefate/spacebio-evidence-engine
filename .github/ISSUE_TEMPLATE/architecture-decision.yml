name: Architecture decision
description: Propose or revise a material architecture, RAG, data, or platform decision
title: "[adr] "
labels: ["architecture"]
body:
  - type: markdown
    attributes:
      value: |
        Material architecture changes require human direction. Record outcomes in `docs/governance/DECISION_LOG.md` (and dedicated ADR files when that format is approved).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision is forced by current constraints or goals?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the decision should enable or protect.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Current architecture, related ADRs, MVP vs future boundaries, and constraints.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Decision options in scope for this issue (analysis and recommendation).
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Implementation work deferred until the decision is approved.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Options compared with trade-offs
        - [ ] Recommendation recorded
        - [ ] Decision log / ADR updated after human approval
        - [ ] Follow-up implementation issues filed if needed
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: None
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Files or components likely affected
      description: Architecture docs, Compose, schemas, RAG pipelines, or deployment config that would change if approved.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing requirements
      description: Spikes, benchmarks, or proof points needed to support the decision.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation requirements
      description: Decision log, architecture docs, and AGENTS/command updates if tooling changes.
    validations:
      required: true
  - type: textarea
    id: scientific_provenance
    attributes:
      label: Scientific provenance considerations
      description: Impact on grounding, citations, corpus handling, or evidence sufficiency.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Secrets, network exposure, dependency, or data-handling implications.
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
    validations:
      required: true
  - type: dropdown
    id: parallel_safe
    attributes:
      label: Whether parallel work is safe
      options:
        - "Yes — parallel work is safe outside listed files"
        - "No — serialize related work"
        - "Unknown — needs human coordination"
    validations:
      required: true
  - type: textarea
    id: blocking_issues
    attributes:
      label: Blocking issues
      placeholder: None
    validations:
      required: true
  - type: textarea
    id: human_decisions
    attributes:
      label: Human decisions required
      description: The architecture choice that only the human owner may approve.
    validations:
      required: true
